/* ═════════════════════════════════════════════
   Probe-style mouse pointer (hidden on touch screens)
   ═════════════════════════════════════════════ */
const FINE_POINTER = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
const INTERACTIVE = 'button, a, [role="button"], [role="switch"], [role="slider"], input, label';

const ProbeCursor = () => {
    const wrap = useRef(null), dot = useRef(null), ring = useRef(null);
    useEffect(() => {
        if (!FINE_POINTER) return;
        document.documentElement.classList.add('probe-cursor');
        let x = -100, y = -100, rx = -100, ry = -100, raf = 0;
        const lag = REDUCED ? 1 : .2;
        const loop = () => {
            rx += (x - rx) * lag; ry += (y - ry) * lag;
            dot.current.style.transform = `translate3d(${x}px, ${y}px, 0)`;
            ring.current.style.transform = `translate3d(${rx}px, ${ry}px, 0)`;
            raf = Math.abs(x - rx) + Math.abs(y - ry) > .3 ? requestAnimationFrame(loop) : 0;
        };
        const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };
        const w = wrap.current;
        const move = e => { x = e.clientX; y = e.clientY; w.classList.remove('cur-hidden'); kick(); };
        const over = e => w.classList.toggle('cur-hover', !!e.target.closest?.(INTERACTIVE));
        const down = () => w.classList.add('cur-down');
        const up = () => w.classList.remove('cur-down');
        const leave = e => { if (!e.relatedTarget) w.classList.add('cur-hidden'); };
        addEventListener('pointermove', move, { passive: true });
        addEventListener('pointerover', over, { passive: true });
        addEventListener('pointerdown', down); addEventListener('pointerup', up);
        document.addEventListener('pointerout', leave);
        return () => {
            cancelAnimationFrame(raf);
            document.documentElement.classList.remove('probe-cursor');
            removeEventListener('pointermove', move); removeEventListener('pointerover', over);
            removeEventListener('pointerdown', down); removeEventListener('pointerup', up);
            document.removeEventListener('pointerout', leave);
        };
    }, []);
    if (!FINE_POINTER) return null;
    return (
        <div ref={wrap} className="cur-hidden" aria-hidden="true">
            <div ref={ring} className="cur-ring"><i /></div>
            <div ref={dot} className="cur-dot" />
        </div>
    );
};

/* Shared pointer plumbing for the custom cursors: hides the native one, tracks hover/press/leave */
const usePointerShell = (wrap, onMove, onDown) => useEffect(() => {
    if (!FINE_POINTER) return;
    document.documentElement.classList.add('probe-cursor');
    const w = wrap.current;
    const move = e => { w.classList.remove('cur-hidden'); onMove(e.clientX, e.clientY); };
    const over = e => w.classList.toggle('cur-hover', !!e.target.closest?.(INTERACTIVE));
    const down = e => { w.classList.add('cur-down'); onDown && onDown(e.clientX, e.clientY); };
    const up = () => w.classList.remove('cur-down');
    const leave = e => { if (!e.relatedTarget) w.classList.add('cur-hidden'); };
    addEventListener('pointermove', move, { passive: true });
    addEventListener('pointerover', over, { passive: true });
    addEventListener('pointerdown', down); addEventListener('pointerup', up);
    document.addEventListener('pointerout', leave);
    return () => {
        document.documentElement.classList.remove('probe-cursor');
        removeEventListener('pointermove', move); removeEventListener('pointerover', over);
        removeEventListener('pointerdown', down); removeEventListener('pointerup', up);
        document.removeEventListener('pointerout', leave);
    };
}, []);

/* 1. Current trail: a glowing PCB trace with 45° bends that follows the pointer and fades */
const TrailCursor = () => {
    const wrap = useRef(null), cv = useRef(null), head = useRef(null), api = useRef({});
    useEffect(() => {
        if (!FINE_POINTER) return;
        const c = cv.current, ctx = c.getContext('2d');
        let dpr = 1, verts = [], mx = -100, my = -100, raf = 0;
        const LIFE = 1100, MIN = 14, Q = Math.PI / 4;
        const size = () => { dpr = Math.min(devicePixelRatio || 1, 2); c.width = innerWidth * dpr; c.height = innerHeight * dpr; };
        size(); addEventListener('resize', size);
        const frame = () => {
            const now = performance.now();
            verts = verts.filter(v => now - v.t < LIFE);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            const seg = (a, b, k) => {
                ctx.strokeStyle = `rgba(0,242,254,${k * .9})`; ctx.lineWidth = 2.2;
                ctx.shadowColor = 'rgba(0,242,254,.9)'; ctx.shadowBlur = 10 * k;
                ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
            };
            for (let i = 1; i < verts.length; i++) {
                const k = 1 - (now - verts[i].t) / LIFE;
                seg(verts[i - 1], verts[i], k);
                if (verts[i].via) {   /* little solder pads along the trace */
                    ctx.shadowBlur = 0; ctx.fillStyle = '#0B0F17'; ctx.strokeStyle = `rgba(212,175,55,${k})`; ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.arc(verts[i].x, verts[i].y, 3.2, 0, 7); ctx.fill(); ctx.stroke();
                }
            }
            if (verts.length) seg(verts[verts.length - 1], { x: mx, y: my }, 1);
            ctx.shadowBlur = 0;
            raf = verts.length ? requestAnimationFrame(frame) : 0;
            if (!raf) ctx.clearRect(0, 0, innerWidth, innerHeight);
        };
        api.current.move = (x, y) => {
            mx = x; my = y;
            head.current.style.transform = `translate3d(${x}px, ${y}px, 0)`;
            const now = performance.now();
            if (!verts.length) verts.push({ x, y, t: now });
            const last = verts[verts.length - 1], dx = x - last.x, dy = y - last.y, len = Math.hypot(dx, dy);
            if (len > MIN) {   /* snap each new run of trace to the nearest 45° like PCB routing */
                const a = Math.round(Math.atan2(dy, dx) / Q) * Q;
                verts.push({ x: last.x + Math.cos(a) * len, y: last.y + Math.sin(a) * len, t: now, via: Math.random() < .22 });
            }
            if (!raf) raf = requestAnimationFrame(frame);
        };
        return () => { cancelAnimationFrame(raf); removeEventListener('resize', size); };
    }, []);
    usePointerShell(wrap, (x, y) => api.current.move?.(x, y), (x, y) => burst({ x, y, n: 14, kind: 'spark' }));
    if (!FINE_POINTER) return null;
    return (
        <div ref={wrap} className="cur-hidden" aria-hidden="true">
            <canvas ref={cv} className="trail-canvas" />
            <div ref={head} className="trail-head" />
        </div>
    );
};

/* 2. Soldering iron: glowing tip; a click drops a solder blob with a wisp of smoke */
const SolderCursor = () => {
    const wrap = useRef(null), iron = useRef(null);
    const drop = (x, y) => {
        const add = (cls, style) => {
            const el = document.createElement('div'); el.className = cls; Object.assign(el.style, style);
            document.body.appendChild(el); el.addEventListener('animationend', () => el.remove());
        };
        add('solder-blob', { left: `${x}px`, top: `${y}px` });
        if (!REDUCED) [-10, 2, 12].forEach((sx, i) => add('smoke', { left: `${x + sx / 3}px`, top: `${y - 4}px`, animationDelay: `${i * .12}s`, '--sx': `${sx}px` }));
    };
    usePointerShell(wrap, (x, y) => { iron.current.style.transform = `translate3d(${x}px, ${y}px, 0)`; }, drop);
    if (!FINE_POINTER) return null;
    return (
        <div ref={wrap} className="cur-hidden" aria-hidden="true">
            <div ref={iron} className="iron">
                <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                    <defs>
                        <radialGradient id="tipGlow"><stop offset="0" stopColor="#FFD27A" stopOpacity=".95" /><stop offset=".45" stopColor="#F59E0B" stopOpacity=".5" /><stop offset="1" stopColor="#F59E0B" stopOpacity="0" /></radialGradient>
                        <linearGradient id="tipMetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#FF8A3D" /><stop offset="1" stopColor="#b8864b" /></linearGradient>
                    </defs>
                    <circle className="tip-glow-big" cx="4" cy="4" r="12" fill="url(#tipGlow)" />
                    <circle className="tip-glow" cx="4" cy="4" r="7" fill="url(#tipGlow)" />
                    <path d="M2 2 L13 8 L8 13 Z" fill="url(#tipMetal)" />
                    <line x1="10" y1="10" x2="30" y2="30" stroke="#c3cad3" strokeWidth="4.5" strokeLinecap="round" />
                    <line x1="28" y1="28" x2="33" y2="33" stroke="#4b5563" strokeWidth="8" strokeLinecap="round" />
                    <line x1="33" y1="33" x2="57" y2="57" stroke="#1b2231" strokeWidth="11" strokeLinecap="round" />
                    <line x1="33" y1="33" x2="57" y2="57" stroke="#34415a" strokeWidth="11" strokeLinecap="round" strokeDasharray="0 0" opacity=".35" />
                    {[40, 46, 52].map(p => <line key={p} x1={p - 4.5} y1={p + 4.5} x2={p + 4.5} y2={p - 4.5} stroke="#FF3D8E" strokeWidth="2" strokeLinecap="round" />)}
                </svg>
            </div>
        </div>
    );
};

/* 4. RGB LED: colour follows pointer speed (slow = cyan, fast = pink); flashes on click */
const LedCursor = () => {
    const wrap = useRef(null), led = useRef(null), st = useRef({ x: 0, y: 0, t: 0, v: 0, raf: 0 });
    useEffect(() => () => cancelAnimationFrame(st.current.raf), []);
    const paint = () => {
        const s = st.current;
        if (!led.current) { s.raf = 0; return; }
        s.v *= .9;   /* speed eases back down when the pointer rests */
        const k = Math.min(1, s.v / 1.6);
        led.current.style.setProperty('--c', `hsl(${185 + k * 145} 100% ${58 + k * 4}%)`);
        s.raf = s.v > .01 ? requestAnimationFrame(paint) : 0;
    };
    usePointerShell(wrap, (x, y) => {
        const s = st.current, now = performance.now(), dt = Math.max(8, now - s.t);
        const v = Math.hypot(x - s.x, y - s.y) / dt;
        s.v = s.v * .7 + Math.min(v, 4) * .3; s.x = x; s.y = y; s.t = now;
        led.current.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        if (!s.raf) s.raf = requestAnimationFrame(paint);
    }, () => {
        const el = led.current; el.classList.remove('led-flash'); void el.offsetWidth; el.classList.add('led-flash');
    });
    if (!FINE_POINTER) return null;
    return (
        <div ref={wrap} className="cur-hidden" aria-hidden="true">
            <div ref={led} className="led-cur">
                <div className="halo" />
                <svg width="24" height="40" viewBox="0 0 24 40">
                    <path d="M5 20 V12 A7 7 0 0 1 19 12 V20 Z" style={{ fill: 'var(--c)' }} />
                    <rect x="3.5" y="19" width="17" height="3" rx="1" style={{ fill: 'var(--c)' }} opacity=".75" />
                    <line x1="9" y1="22" x2="9" y2="39" stroke="#aab3be" strokeWidth="1.6" />
                    <line x1="15" y1="22" x2="15" y2="35" stroke="#aab3be" strokeWidth="1.6" />
                    <ellipse cx="9.5" cy="11.5" rx="1.8" ry="3.4" fill="#fff" opacity=".6" />
                </svg>
            </div>
        </div>
    );
};

const CURSORS = { probe: ProbeCursor, trail: TrailCursor, solder: SolderCursor, led: LedCursor };
const CURSOR_NAMES = { probe: 'Probe', trail: 'Current trail', solder: 'Soldering iron', led: 'RGB LED' };

/* review helper: add ?pick to the address to switch pointer styles live */
const CursorPicker = ({ mode, setMode }) => (
    <div className="fixed bottom-4 left-4 z-[81] flex flex-wrap gap-1.5 p-1.5 rounded-xl border border-white/10 bg-[#161D2B]/90 backdrop-blur text-[12px]">
        {Object.keys(CURSORS).map(k => (
            <button key={k} onClick={() => setMode(k)}
                    className={`px-2.5 py-1.5 rounded-lg ${mode === k ? 'bg-neon text-obsidian font-medium' : 'text-muted hover:text-ink'}`}>{CURSOR_NAMES[k]}</button>
        ))}
    </div>
);

/* Gentler, gliding wheel scrolling on desktop; touch and reduced-motion keep native scrolling */
const useSmoothScroll = () => useEffect(() => {
    if (REDUCED || !FINE_POINTER) return;
    const SPEED = .6, EASE = .085;
    let target = scrollY, current = scrollY, raf = 0;
    const max = () => document.documentElement.scrollHeight - innerHeight;
    const loop = () => {
        current += (target - current) * EASE;
        if (Math.abs(target - current) < .5) { current = target; raf = 0; } else raf = requestAnimationFrame(loop);
        scrollTo(0, current);
    };
    const innerScroller = el => {
        for (; el && el !== document.body; el = el.parentElement) {
            const oy = getComputedStyle(el).overflowY;
            if ((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight) return el;
        }
        return null;
    };
    const onWheel = e => {
        if (e.ctrlKey || innerScroller(e.target)) return;   /* pinch-zoom and inner scroll boxes stay native */
        e.preventDefault();
        const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
        if (!raf) current = target = scrollY;
        target = Math.max(0, Math.min(max(), target + d * SPEED));
        if (!raf) raf = requestAnimationFrame(loop);
    };
    const onScroll = () => { if (!raf) current = target = scrollY; };   /* keys, scrollbar, scrollIntoView */
    addEventListener('wheel', onWheel, { passive: false });
    addEventListener('scroll', onScroll, { passive: true });
    return () => { cancelAnimationFrame(raf); removeEventListener('wheel', onWheel); removeEventListener('scroll', onScroll); };
}, []);

/* ═════════════════════════════════════════════
   App
   ═════════════════════════════════════════════ */
const App = () => {
    useSmoothScroll();
    const params = new URLSearchParams(location.search);
    const [cursorMode, setCursorMode] = useState(CURSORS[params.get('cursor')] ? params.get('cursor') : CFG.cursor);
    const Cursor = CURSORS[cursorMode] || ProbeCursor;
    return (
    <>
        <Confetti />
        <SoundToggle />
        <Cursor key={cursorMode} />
        {params.has('pick') && FINE_POINTER && <CursorPicker mode={cursorMode} setMode={setCursorMode} />}
        <div className="fixed inset-0 bg-board pointer-events-none" aria-hidden="true" />
        <div className="fixed inset-0 bg-glow pointer-events-none" aria-hidden="true" />
        <main className="relative">
            <GiftIntro />
            <Hero />
            <Board />
            <Terminal />
            <Reasons />
            <GuessGame />
            <PowerDown />
            <FistBump />
            <footer className="px-5 sm:px-8 py-14 max-w-6xl mx-auto border-t border-edge/60 flex flex-wrap justify-between gap-3 text-[13px] text-dim">
                <span>Made for {CFG.name} with love and low impedance.</span>
                <span className="font-mono text-xs">KD-BDAY-PCB rev {CFG.age}.0</span>
            </footer>
        </main>
    </>
    );
};

/* always start at the wrapped present, even on refresh */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
scrollTo(0, 0);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
